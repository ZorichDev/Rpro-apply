version: "3.9"
services:
  mongodb:
    image: mongo:7
    container_name: rpro-apply-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./packages/backend
    container_name: rpro-apply-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/rpro-apply
    depends_on:
      - mongodb

volumes:
  mongo-data:
